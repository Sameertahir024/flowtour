name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build FlowTour distribution
        run: npm run build

      - name: Prepare demo directory
        run: |
          mkdir -p demo-site/dist
          mkdir -p demo-site/logo
          mkdir -p demo-site/examples/logo
          cp -r dist/* demo-site/dist/
          cp -r examples/logo/* demo-site/logo/ || true
          cp -r examples/logo/* demo-site/examples/logo/ || true
          cp examples/basic.html demo-site/examples/basic.html
          # Fix paths for root index.html so ../dist/ resolves to ./dist/ and relative links work
          sed 's|\.\./dist/|dist/|g' examples/basic.html > demo-site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
